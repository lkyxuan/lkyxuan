name: Pulse watchdog

# The machine can't report its own death. If it stops beating, this turns the banner red.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: pulse
          path: pulse
      - run: python3 render.py watch pulse
      - name: Publish flatline
        working-directory: pulse
        run: |
          git diff --quiet && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state.json pulse.svg
          git commit -q --amend -m "pulse"
          git push -q --force origin pulse
